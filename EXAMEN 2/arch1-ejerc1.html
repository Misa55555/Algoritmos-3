<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursividad Básica - Simple</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input[type="number"], button { padding: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        button { background-color: #5cb85c; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #resultado { margin-top: 15px; padding: 10px; background-color: #f9f9f9; border: 1px solid #eee; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>ESTO ESTA CON CHATI, CREO QUE ES PARTE DE UN EJERCICIO</h1>

<div class="container">
    <h2>Números Intermedios (Recursivo Simple)</h2>
    
    <form id="formularioNumeros" onsubmit="event.preventDefault(); iniciarRecursividad();">
        <label for="num1">Número Inicial:</label>
        <input type="number" id="num1" value="3" required>

        <label for="num2">Número Final:</label>
        <input type="number" id="num2" value="10" required>

        <button type="submit">Mostrar Números</button>
    </form>

    <div id="resultado">Esperando entrada...</div>
</div>

<script>
    // ----------------------------------------------------------------------
    // 1. FUNCIÓN RECURSIVA BÁSICA (El corazón del ejercicio)
    // ----------------------------------------------------------------------
    function mostrarNumerosRecursivo(actual, limite, elementoResultado) {
        const siguiente = actual + 1;

        // CASO BASE: Si llegamos o superamos el límite, se detiene.
        if (siguiente >= limite) {
            return; 
        }

        // PASO RECURSIVO: Muestra el número.
        elementoResultado.innerHTML += siguiente + "<br>";

        // Llamada a sí misma
        mostrarNumerosRecursivo(siguiente, limite, elementoResultado);
    }

    // ----------------------------------------------------------------------
    // 2. FUNCIÓN DE INICIO (El pegamento necesario)
    // ----------------------------------------------------------------------
    // Esta función lee los valores del DOM y hace la primera llamada.
    function iniciarRecursividad() {
        // Obtenemos los valores de los inputs
        const num1 = parseInt(document.getElementById('num1').value);
        const num2 = parseInt(document.getElementById('num2').value);
        const resultadoDiv = document.getElementById('resultado');
        
        // Limpiamos la salida
        resultadoDiv.innerHTML = `Números entre ${num1} y ${num2}:<br>`;

        // Llamamos a la función recursiva
        mostrarNumerosRecursivo(num1, num2, resultadoDiv);
    }
</script>

</body>
</html>
