<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador de lista enlazada</title>
  <style>
    body {
      background-color: #2f3b3e;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 10px;
    }

    .container {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .controls {
      margin-right: 40px;
      text-align: left;
    }

    label {
      font-size: 14px;
    }

    input {
      width: 150px;
      padding: 5px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      display: block;
      width: 160px;
      padding: 8px;
      margin: 8px 0;
      background-color: #546e7a;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #78909c;
    }

    .list {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      max-width: 600px;
    }

    .node {
      background-color: #2196f3;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Administrador de lista enlazada</h1>
  <h3>Listado de valores</h3>

  <div class="container">
    <!-- Panel de control -->
    <div class="controls">
      <label for="valor">Ingresa un valor</label><br>
      <input type="text" id="valor" placeholder="Valor"><br>
      <button onclick="agregar()">Agregar</button>
      <button onclick="buscar()">Buscar</button>
      <button onclick="eliminar()">Eliminar</button>
    </div>

    <!-- Lista de nodos -->
    <div class="list" id="lista">
      <div class="node">1</div>
      <div class="node">2</div>
      <div class="node">3</div>
      <div class="node">4</div>
      <div class="node">5</div>
      <div class="node">6</div>
    </div>
  </div>

  <script>
    const lista = document.getElementById("lista");

    function agregar() {
      const valor = document.getElementById("valor").value;
      if (valor.trim() === "") return alert("Ingresa un valor válido");
      const nodo = document.createElement("div");
      nodo.classList.add("node");
      nodo.innerText = valor;
      lista.appendChild(nodo);
      document.getElementById("valor").value = "";
    }

    function buscar() {
      const valor = document.getElementById("valor").value;
      if (valor.trim() === "") return alert("Ingresa un valor a buscar");
      const nodos = document.querySelectorAll(".node");
      let encontrado = false;
      nodos.forEach(nodo => {
        nodo.style.border = "none"; 
        if (nodo.innerText === valor) {
          nodo.style.border = "3px solid yellow";
          encontrado = true;
        }
      });
      if (!encontrado) alert("Valor no encontrado en la lista");
    }

    function eliminar() {
      const valor = document.getElementById("valor").value;
      if (valor.trim() === "") return alert("Ingresa un valor a eliminar");
      const nodos = document.querySelectorAll(".node");
      let eliminado = false;
      nodos.forEach(nodo => {
        if (nodo.innerText === valor && !eliminado) {
          nodo.remove();
          eliminado = true;
        }
      });
      if (!eliminado) alert("Valor no encontrado en la lista");
      document.getElementById("valor").value = "";
    }
  </script>
</body>
</html>
