<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Futurista de Alumnos</title>
  <style>
    /* Fondo general con efecto gradiente animado */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(-45deg, #0f0f1a, #1b0034, #001f3f, #1a003a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-size: 2.5em;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #0ff;
      text-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
      to { text-shadow: 0 0 20px #0ff, 0 0 40px #0ff; }
    }

    /* Formulario futurista */
    form {
      background: rgba(20, 20, 40, 0.9);
      border: 2px solid #0ff;
      border-radius: 15px;
      box-shadow: 0 0 20px #0ff;
      padding: 25px;
      max-width: 600px;
      margin: 20px auto;
      backdrop-filter: blur(10px);
    }

    form label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
    }

    form input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 2px solid #0ff;
      border-radius: 8px;
      background: #111;
      color: #0ff;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
      box-shadow: inset 0 0 10px #0ff;
    }

    form input:focus {
      border-color: #ff00ff;
      box-shadow: 0 0 10px #ff00ff, inset 0 0 10px #ff00ff;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      color: #fff;
      background: linear-gradient(90deg, #0ff, #ff00ff, #0ff);
      background-size: 200% auto;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      box-shadow: 0 0 15px #0ff;
      transition: 0.4s;
      animation: gradientMove 4s infinite linear;
    }

    @keyframes gradientMove {
      0% {background-position: 0%;}
      100% {background-position: 200%;}
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #ff00ff, 0 0 40px #0ff;
    }

    /* Tabla neon */
    table {
      width: 90%;
      margin: 30px auto;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 0 25px #0ff;
    }

    table thead {
      background: rgba(0,255,255,0.2);
    }

    table th {
      padding: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #0ff;
      border-bottom: 2px solid #0ff;
      background: rgba(0,0,0,0.8);
      text-shadow: 0 0 10px #0ff;
    }

    table td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid rgba(0,255,255,0.3);
      color: #fff;
      background: rgba(0,0,0,0.5);
    }

    table tr:hover td {
      background: rgba(255,0,255,0.2);
      color: #ff00ff;
      text-shadow: 0 0 8px #ff00ff;
    }
  </style>
</head>
<body>
  <h1>Registro Futurista de Alumnos</h1>
  
  <form>
    <label for="apellido">Apellido</label>
    <input type="text" id="apellido">

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre">

    <label for="domicilio">Domicilio</label>
    <input type="text" id="domicilio">

    <label for="localidad">Localidad</label>
    <input type="text" id="localidad">

    <label for="carrera">Carrera</label>
    <input type="text" id="carrera">

    <label for="telefono">Teléfono</label>
    <input type="text" id="telefono">

    <label for="email">Email</label>
    <input type="text" id="email">

    <button type="button" onclick="mostrarAlumnos()">Agregar Alumno</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Apellido</th>
        <th>Nombre</th>
        <th>Domicilio</th>
        <th>Localidad</th>
        <th>Carrera</th>
        <th>Teléfono</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="contenidoTabla"></tbody>
  </table>

  <script>
    let personal = [];

    function Alumno(apellido,nombre,domicilio,localidad,carrera,telefono,email){
      this.apellido = apellido;
      this.nombre = nombre;
      this.domicilio = domicilio;
      this.localidad = localidad;
      this.carrera = carrera;
      this.telefono = telefono;
      this.email = email;
    }

    function mostrarAlumnos(){
      let apellido1 = document.getElementById("apellido").value;
      let nombre1 = document.getElementById("nombre").value;
      let domicilio1 = document.getElementById("domicilio").value;
      let localidad1 = document.getElementById("localidad").value;
      let carrera1 = document.getElementById("carrera").value;
      let telefono1 = document.getElementById("telefono").value;
      let email1 = document.getElementById("email").value;

      if(apellido1 && nombre1){
        let alumno1 = new Alumno(apellido1,nombre1,domicilio1,localidad1,carrera1,telefono1,email1);
        personal.push(alumno1);

        document.getElementById("contenidoTabla").innerHTML += `
          <tr>
            <td>${alumno1.apellido}</td>
            <td>${alumno1.nombre}</td>
            <td>${alumno1.domicilio}</td>
            <td>${alumno1.localidad}</td>
            <td>${alumno1.carrera}</td>
            <td>${alumno1.telefono}</td>
            <td>${alumno1.email}</td>
          </tr>`;
      } else {
        alert("Apellido y Nombre son obligatorios.");
      }
    }
  </script>
</body>
</html>
